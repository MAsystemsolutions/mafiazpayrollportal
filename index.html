<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" id="touchicon">
<title>Portal</title>
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0f13; --panel:#151821; --panel2:#1b1f2a; --line:#262b38; --text:#eceef3; --muted:#8d95a6;
  --gold:#d4a24c; --gold2:#f0c46d; --green:#3ecf8e; --red:#ef5b5b; --blue:#5aa9ff; --amber:#f5a524; --violet:#a78bfa;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(13,15,19,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.brand{display:flex;gap:10px;align-items:center}
.brand b{letter-spacing:3px;text-transform:uppercase;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px}
.logo{width:42px;height:42px;border-radius:10px;object-fit:cover;display:block;border:1px solid rgba(212,162,76,.35)}
span.logo{display:grid;place-items:center;font-weight:800;font-size:18px;color:#111;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.auth-card .logo{width:64px;height:64px;border-radius:14px}
.who{display:flex;gap:8px;align-items:center}
.who span{color:var(--muted);margin-right:6px}
.tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:9px 14px;border-radius:10px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--text);background:var(--panel)}
.tabs button.on{color:#111;background:var(--gold)}
.badge:empty{display:none}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
.grid2>.card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.stat.gold{border-color:rgba(212,162,76,.45);background:linear-gradient(160deg,rgba(212,162,76,.14),var(--panel))}
.stat.gold .v{color:var(--gold2)}
.stack{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{margin:0 auto 0 0;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:12px}
/* forms */
label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto;display:inline-block;margin:0 8px 0 0;accent-color:var(--gold)}
input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.fgrid .full{grid-column:1/-1}
.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.big{width:100%;padding:14px;font-size:15px;margin-top:6px}
.btn.danger{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#062b1b}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--text)}
.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.sm{padding:6px 10px;font-size:12px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--panel2);font-weight:600}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:200px}
tr.tot td{font-weight:700;background:var(--panel2)}
.gold-t{color:var(--gold2);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:26px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.on,.st.Approved{color:var(--green);background:rgba(62,207,142,.12)}
.st.out{color:var(--blue);background:rgba(90,169,255,.12)}
.st.off,.st.Pending{color:var(--amber);background:rgba(245,165,36,.12)}
.st.none,.st.Denied,.st.High{color:var(--red);background:rgba(239,91,91,.12)}
.st.Cancelled,.st.Inactive,.st.Low{color:var(--muted);background:rgba(141,149,166,.12)}
.st.Medium{color:var(--amber);background:rgba(245,165,36,.12)}
.st.Open{color:var(--red);background:rgba(239,91,91,.12)}
.st.Monitoring{color:var(--violet);background:rgba(167,139,250,.12)}
.st.Resolved,.st.Active{color:var(--green);background:rgba(62,207,142,.12)}
/* clock */
.clock{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px}
.clock.live{border-color:rgba(62,207,142,.45);background:linear-gradient(160deg,rgba(62,207,142,.1),var(--panel))}
.clock form{text-align:left;margin-top:6px}
.status{font-weight:700}
.status.on{color:var(--green)}
.status.off{color:var(--muted)}
.timer{font-size:46px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
/* requests */
.req{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.req .meta{color:var(--muted);font-size:12px;margin-top:4px}
.req .reason{margin-top:8px}
.req .acts{display:flex;gap:6px;align-items:flex-start}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0%,rgba(212,162,76,.16),transparent 45%),var(--bg)}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.auth-card .brand{margin-bottom:22px}
.auth-card h2{margin:0 0 4px}
.err{background:rgba(239,91,91,.12);color:#ffb3b3;border:1px solid rgba(239,91,91,.35);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.onb{max-width:860px;margin:0 auto;padding:24px 16px 60px}
.steps{display:flex;gap:8px;margin:0 0 16px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.docbox{background:#fbfaf7;color:#1d1d1f;border-radius:12px;padding:30px;max-height:58vh;overflow:auto;line-height:1.6;font-size:13.5px}
.docbox .doc-head{display:flex;justify-content:space-between;border-bottom:3px solid #b8892f;padding-bottom:10px;margin-bottom:16px}
.docbox .doc-brand{font-size:22px;font-weight:800;letter-spacing:4px;text-transform:uppercase}
.docbox .doc-date{color:#777;padding-top:8px}
.docbox h1{font-size:19px;margin:0 0 12px}
.docbox h2{font-size:14px;margin:16px 0 4px;color:#7a5a17}
.docbox .ex{background:#f3ead6;padding:8px 12px;border-left:3px solid #b8892f;border-radius:4px}
.docbox .sign-grid{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.docbox .sign-grid>div{flex:1;min-width:200px}
.docbox .sig{font-family:'Dancing Script',cursive;font-size:28px;color:#1b2a6b;min-height:40px}
.docbox .agency-sig{font-family:Inter;font-size:14px;font-weight:700;color:#111;padding-top:14px}
.docbox .sig-line{border-top:1px solid #333}
.docbox .sig-cap{font-size:11px;color:#666;margin-top:4px}
.sigpad{display:block;width:100%;height:170px;background:#fbfaf7;border:1px dashed rgba(212,162,76,.6);border-radius:12px;touch-action:none;cursor:crosshair;margin-top:12px}
#sigMode{margin-bottom:4px}
.docbox .sig-img{height:60px;max-width:280px;display:block}
.sigprev{font-family:'Dancing Script',cursive;font-size:30px;color:var(--gold2);min-height:44px;border-bottom:1px solid var(--line);margin:4px 0 14px;padding:0 4px}
.agree{display:flex;align-items:flex-start;color:var(--text);font-size:13px;margin:14px 0}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-card.wide{max-width:780px}
.hb{max-height:60vh;overflow:auto;padding-right:6px}
.hb-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.hb-sec:last-child{border-bottom:0}
.hb-sec h4{margin:0 0 6px;font-size:14px;color:var(--gold2)}
.hb-sec p{margin:6px 0;line-height:1.6}
.hb-sec ul{margin:6px 0;padding-left:20px;line-height:1.65}
.hb-edit{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.hb-edit summary{cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
.hb-edit summary::-webkit-details-marker{display:none}
.hb-edit .num{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--gold);color:#111;font-weight:800;font-size:12px;margin-right:8px}
.warn{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:14px;background:var(--panel2);margin-bottom:10px}
.warn.lv3,.warn.lv4{border-left-color:var(--red)}
.warn .meta{color:var(--muted);font-size:12px;margin-top:4px}
.schedrow{display:grid;grid-template-columns:70px 90px 1fr 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.schedrow input[type=time]{margin:0}
.schedrow label{margin:0}
.daycell{font-size:12px;white-space:nowrap}
.note{background:rgba(212,162,76,.08);border:1px solid rgba(212,162,76,.3);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.modal-card h3{margin:0 0 14px}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.mrow b{font-variant-numeric:tabular-nums}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t-item{background:#232836;border:1px solid var(--line);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.t-item.ok{border-color:rgba(62,207,142,.5)}
.t-item.err{border-color:rgba(239,91,91,.6);color:#ffc4c4}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:60px;color:var(--muted)}
.chart-box{position:relative;height:300px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--gold);color:#111;font-weight:700}
.rule summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule summary::-webkit-details-marker{display:none}
.rule summary::before{content:"▸";color:var(--gold);transition:transform .15s}
.rule[open] summary::before{transform:rotate(90deg)}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.rule-step{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.rule-step .num{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#111;font-weight:800;font-size:13px}
.rule-ex{margin-top:12px;padding:12px 14px;border-radius:12px;border-left:3px solid var(--gold);background:rgba(212,162,76,.08);line-height:1.7}
/* shift report */
.rep-lines{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.rep-line{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.rep-line:last-child{border-bottom:0}
.rep-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rep-mini{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
/* laptops: comfortable width */
@media (min-width:1400px){ main{max-width:1320px} }
/* phones */
@media (max-width:640px){
  html,body{font-size:15px}
  main{padding:14px 12px calc(90px + env(safe-area-inset-bottom))}
  .card{padding:14px;border-radius:12px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:12px}
  .stat .v{font-size:18px}
  .toolbar h2{width:100%;margin:0}
  input,select,textarea{font-size:16px} /* stops iPhone zooming into fields */
  .btn,.ghost{min-height:40px}
  .ghost.sm,.btn.sm{min-height:34px}
  th,td{padding:8px 10px;font-size:13px}
  .modal{place-items:end center;padding:0}
  .modal-card,.modal-card.wide{max-width:100%;border-radius:18px 18px 0 0;max-height:92vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .schedrow{grid-template-columns:44px 1fr;row-gap:6px}
  .schedrow input[type=time]{grid-column:span 1}
  .docbox{padding:18px;font-size:13px}
  .rep-acts .btn,.rep-acts .ghost{flex:1}
  /* agents: tabs become a bottom bar like a phone app */
  body.is-agent .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(21,24,33,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:0}
  body.is-agent .tabs button{flex:1;flex-direction:column;justify-content:center;font-size:11.5px;padding:8px 2px;border-radius:10px;position:relative}
  body.is-agent .tabs .badge{position:absolute;top:2px;right:18%;font-size:10px;padding:0 5px}
  body.is-admin .tabs{position:sticky;top:61px;z-index:15;background:var(--bg)}
}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .timer{font-size:38px}
  .who span{display:none}
  .top{padding:12px 16px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modalBody"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends in /exec)
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyb8UMHiYOs9ZflwAoFM4HiLHTA5bZOkMpJtFRKIs1b8qGMF6sXlXxMhMLumcAzVC3F/exec';
/* Brand (name, logo, color, rates) comes from CONFIG in Code.gs — nothing to edit here. */
let AGENCY = '', LOGO = '', W = 'Agent';
let B = { agency: '', worker: 'Agent', accent: '#d4a24c', logo: '', hourlyRate: 3, commissionRate: 0.01, employeeShare: 0.7, feeRate: 0, timezoneLabel: '' };
const SP = () => Math.round((Number(B.employeeShare) || 0.7) * 100);   // agent share %
const AP = () => 100 - SP();                                           // agency share %
function logoHtml() { return LOGO ? `<img class="logo" src="${LOGO}" alt="">` : `<span class="logo">${esc((AGENCY || '?').charAt(0))}</span>`; }
function lighten(hex, p) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * p).toString(16).padStart(2, '0')).join('');
}
function applyBrand(b) {
  B = Object.assign(B, b || {});
  AGENCY = B.agency || 'Portal'; LOGO = B.logo || ''; W = B.worker || 'Agent';
  document.title = AGENCY + ' Portal';
  if (/^#[0-9a-f]{6}$/i.test(B.accent || '')) {
    document.documentElement.style.setProperty('--gold', B.accent);
    document.documentElement.style.setProperty('--gold2', lighten(B.accent, .25));
  }
  try { if (LOGO) { document.getElementById('favicon').href = LOGO; document.getElementById('touchicon').href = LOGO; } } catch (e) {}
}
async function loadBranding() {
  let cached = null;
  try { cached = JSON.parse(store.get('mz_brand') || 'null'); } catch (e) {}
  if (cached) applyBrand(cached);
  const fresh = api('branding').then(b => { store.set('mz_brand', JSON.stringify(b)); applyBrand(b); return b; }).catch(() => null);
  if (!cached) await fresh;
}

/* ---------------- state & helpers ---------------- */
const S = { token: null, role: null, name: '', data: null, tab: null, charts: {}, emps: null, dashDate: '', payDate: '', reqFilter: 'Pending', days: 30, prefill: null };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hm = h => { const t = Math.round((Number(h) || 0) * 60); return Math.floor(t / 60) + 'h ' + String(t % 60).padStart(2, '0') + 'm'; };
const fd = f => Object.fromEntries(new FormData(f).entries());
const loading = () => { $('#view').innerHTML = '<div class="loading"><span class="spin"></span></div>'; };
const errBox = m => `<div class="card"><div class="err">${esc(m)}</div><button class="ghost" onclick="go(S.tab)">Try again</button></div>`;
const stat = (k, v, s, cls) => `<div class="stat ${cls || ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

async function api(action, payload) {
  if (API_URL.indexOf('http') !== 0) throw new Error('API_URL is not set yet. Paste your Apps Script web app URL at the top of index.html.');
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, token: S.token }, payload || {})) });
  } catch (e) { throw new Error('Could not reach the server. Check your internet connection.'); }
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { logout(true); throw new Error('Your session expired. Please log in again.'); }
    if (j.error === 'ONBOARDING_REQUIRED') { boot(); throw new Error('Please finish your onboarding first.'); }
    if (j.error === 'PASSWORD_CHANGE_REQUIRED') { boot(); throw new Error('Please set your own password first.'); }
    throw new Error(j.error);
  }
  return j.data;
}

function downloadB64(f) {
  const bin = atob(f.b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: f.mime || 'application/pdf' }));
  const a = document.createElement('a');
  a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function clockStr(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* Signature pad: draw with mouse, pen or finger */
function sigPad(canvas) {
  const ctx = canvas.getContext('2d');
  let drawing = false, empty = true, last = null;
  function resize() {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const keep = empty ? null : canvas.toDataURL();
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b2a6b';
    if (keep) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = keep; }
  }
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing = true; last = pos(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = '#1b2a6b'; ctx.fill(); empty = false; });
  canvas.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));
  window.addEventListener('resize', resize);
  return {
    resize: resize,
    clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); empty = true; },
    isEmpty: () => empty,
    toDataURL: () => canvas.toDataURL('image/png')
  };
}

/* End-of-shift report as plain text, in the agency's usual format (for Telegram / chat) */
function reportText(r) {
  const n = v => (v === '' || v == null) ? '0' : String(v);
  const out = [];
  out.push("CHATTER'S REPORT");
  out.push('Chatter: ' + r.chatter);
  out.push('Date: ' + r.dateLong);
  out.push('Shift: ' + (r.shift || '—') + (r.tz ? ' ' + r.tz : '') + ' (' + (Math.round((r.hours || 0) * 100) / 100) + ' hours)');
  out.push('Model: ' + r.models.map(m => m.model).join(' | '));
  out.push('');
  r.models.forEach(m => {
    out.push(m.model.toUpperCase() + ' SALES & TIPS GROSS SALES: ' + money(m.gross));
    m.lines.forEach(l => out.push('- ' + l.fan + (l.type ? ' — ' + l.type : '') + ' — ' + money(l.amount) + (l.note ? ' (' + l.note + ')' : '')));
    out.push('');
  });
  out.push('TOTAL GROSS SALES: ' + money(r.totalGross));
  out.push('');
  out.push('NOTES:');
  r.models.forEach(m => {
    out.push(m.model);
    out.push('- ' + n(m.newFans) + ' new fan' + (n(m.newFans) === '1' ? '' : 's'));
    out.push('- ' + n(m.renews) + ' renew' + (n(m.renews) === '1' ? '' : 's'));
    String(m.notes || '').split(/\n+/).filter(Boolean).forEach(x => out.push('- ' + x.replace(/^[-•]\s*/, '')));
    out.push('');
  });
  if (r.generalNotes) { out.push('—————'); out.push(r.generalNotes); }
  return out.join('\n').trim();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Report copied. Paste it in your group chat.'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();

}

async function boot() {
  S.token = store.get('mz_token'); S.role = store.get('mz_role'); S.name = store.get('mz_name') || '';
  // Agent invite link: never open someone else's (e.g. admin's) saved session
  if (AGENT_LINK && !agentLinkHandled) {

    if (S.token && S.role === 'admin') {
      store.del('mz_token'); store.del('mz_role'); store.del('mz_name');

  if (S.role === 'admin') {
    try {

      if (me.mustChangePassword) return renderSetPassword(true);

    if (!me.HandbookAcked) return renderHandbookAck();

}

function reqCard(r, admin) {
  const title = r.type === 'TIME_EDIT'
    ? `Time correction${r.shiftId ? '' : ' (missed shift)'} · ${esc(r.clockIn)} → ${esc(r.clockOut)} <span class="muted">(${hm(r.hours)})</span>`
    : `${esc(r.leaveType || 'Day off')} · ${esc(r.dateLabel)}${r.endDate && r.endDate !== r.date ? ' → ' + esc(r.endLabel) : ''}`;
  let acts = '';
  if (r.status === 'Pending') {
    acts = admin
      ? `<button class="btn green sm" onclick="reviewReq('${r.id}','Approved')">Approve</button><button class="btn danger sm" onclick="reviewReq('${r.id}','Denied')">Deny</button>`
      : `<button class="ghost sm" onclick="run(this,async()=>{await empAct('cancelRequest',{reqId:'${r.id}'});toast('Request cancelled.');})">Cancel</button>`;
  }
  return `<div class="req"><div style="flex:1;min-width:240px">
      <div>${admin ? `<b>${esc(r.name)}</b> · ` : ''}${title}</div>
      <div class="meta">Sent ${esc(r.created)}${r.account ? ' · ' + esc(r.account) : ''}${r.reviewed ? ' · Reviewed ' + esc(r.reviewed) + (admin && r.reviewedBy ? ' by ' + esc(r.reviewedBy) : '') : ''}</div>
      <div class="reason">${esc(r.reason)}</div>
      ${r.adminNote ? `<div class="meta">Admin note: ${esc(r.adminNote)}</div>` : ''}
    </div><div class="acts"><span class="st ${esc(r.status)}">${esc(r.status)}</span>${acts}</div></div>`;
}

function payRuleCard() {
  const rate = Number(B.hourlyRate) || 0, comm = Number(B.commissionRate) || 0, fee = Number(B.feeRate) || 0, sp = SP(), ap = AP();
  const cp = +(comm * 100).toFixed(2), fp = +(fee * 100).toFixed(2), exH = 40, exS = 5000, exN = exS * (1 - fee);
  const exHourly = exH * rate, exComm = exN * comm, exTot = exHourly + exComm, exAgent = exTot * sp / 100;
  const w = esc(W.toLowerCase());
  return `<details class="card rule" open>
    <summary><b>How ${w} salary is computed</b> <span class="muted small">(every cutoff: ${B.period === 'semimonthly' ? '1st–15th and 16th–end of month' : 'weekly, Mon–Sun'}${B.timezoneLabel ? ', ' + esc(B.timezoneLabel) : ''})</span></summary>
    <div class="rule-grid">
      <div class="rule-step"><span class="num">1</span><div><b>Hourly pay</b><div class="muted">Total hours × ${money(rate)}</div></div></div>
      <div class="rule-step"><span class="num">2</span><div><b>Commission</b><div class="muted">${cp}% of <b>net</b> sales (gross sales minus the ${w}'s fees %)</div></div></div>
      <div class="rule-step"><span class="num">3</span><div><b>Total (100%)</b><div class="muted">Hourly pay + commission</div></div></div>
      <div class="rule-step"><span class="num">4</span><div><b>Split</b><div class="muted">${sp}% goes to the ${w} · ${ap}% goes to ${esc(AGENCY)}</div></div></div>
    </div>
    <div class="rule-ex">
      <b>Example:</b> ${exH} hours and ${money(exS)} gross sales${fee ? ` (${money(exN)} net after ${fp}% fees)` : ''} →
      Hourly ${exH} × ${money(rate)} = <b>${money(exHourly)}</b> · Commission ${cp}% × ${money(exN)} net = <b>${money(exComm)}</b> · Total <b>${money(exTot)}</b> →
      ${esc(W)} salary (${sp}%) <b class="gold-t">${money(exAgent)}</b> · ${esc(AGENCY)} cut (${ap}%) <b class="gold-t">${money(exTot - exAgent)}</b>
    </div>
    <p class="muted small" style="margin:10px 0 0">${esc(W)}s only see their ${sp}% salary in their portal and on their payslip. Each ${w}'s rates and fees % show under their name in the table, and can be changed in the ${esc(W)}s tab.</p>
  </details>`;
}

/* ---------------- admin actions ---------------- */
function shiftWeek(n) {
  const p = (S.payDate || todayISO()).split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  S.payDate = d.toISOString().slice(0, 10);
  go('payroll');
}

function adminClockOut(id, name) {
  if (!confirm('Clock out ' + name + ' now?')) return;
  run(null, async () => { await api('adminClockOut', { empId: id }); toast(name + ' clocked out.'); go('dash'); });
}

function reviewReq(id, decision) {
  openModal(`<h3>${decision === 'Approved' ? 'Approve' : 'Deny'} request</h3>
    <label>Note to ${esc(W.toLowerCase())} (optional)<textarea id="rvNote" placeholder="${decision === 'Denied' ? 'Let them know why' : 'Optional'}"></textarea></label>
    <div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button>
    <button class="btn ${decision === 'Approved' ? 'green' : 'danger'}" id="rvBtn">${decision === 'Approved' ? 'Approve' : 'Deny'}</button></div>`);
  $('#rvBtn').onclick = e => run(e.currentTarget, async () => {
    await api('reviewRequest', { reqId: id, decision: decision, note: $('#rvNote').value });
    closeModal(); toast('Request ' + decision.toLowerCase() + '. ' + W + ' notified.'); go('requests');
  });
}

function attWeek(n) {
  const p = (S.attDate || todayISO()).split('-').map(Number);
  S.attDate = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  go('hr');
}

function schedModal(empId) {
  const a = S.scheds.find(x => x.empId === empId);
  const row = d => {
    const v = a.days[d] || ''; const [st, en] = v ? v.split('-') : ['', ''];
    return `<div class="schedrow"><b>${d}</b><label class="agree"><input type="checkbox" class="sWork" data-d="${d}" ${v ? 'checked' : ''}> Working</label>
      <input type="time" class="sStart" data-d="${d}" value="${st || '09:00'}"><input type="time" class="sEnd" data-d="${d}" value="${en || '17:00'}"></div>`;
  };
  openModal(`<h3>Schedule · ${esc(a.name)}</h3>
    <div class="schedrow muted small" style="border:0"><span>Day</span><span></span><span>Start</span><span>End</span></div>
    ${WEEK.map(row).join('')}
    <div style="margin-top:10px"><button type="button" class="ghost sm" id="sCopy">Copy Monday to Mon–Fri</button></div>
    <p class="muted small">Times are in ${esc(B.timezoneLabel || 'your time zone')}. If the end time is earlier than the start, it ends the next day.</p>
    <div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button><button class="btn" id="sSave">Save schedule</button></div>`);
  $('#sCopy').onclick = () => {
    const w = document.querySelector('.sWork[data-d=Mon]').checked, st = document.querySelector('.sStart[data-d=Mon]').value, en = document.querySelector('.sEnd[data-d=Mon]').value;
    ['Tue', 'Wed', 'Thu', 'Fri'].forEach(d => { document.querySelector(`.sWork[data-d=${d}]`).checked = w; document.querySelector(`.sStart[data-d=${d}]`).value = st; document.querySelector(`.sEnd[data-d=${d}]`).value = en; });
  };
  $('#sSave').onclick = e => run(e.currentTarget, async () => {
    const days = {};
    WEEK.forEach(d => {
      if (document.querySelector(`.sWork[data-d=${d}]`).checked) days[d] = { start: document.querySelector(`.sStart[data-d=${d}]`).value, end: document.querySelector(`.sEnd[data-d=${d}]`).value };
    });
    await api('saveSchedule', { empId: empId, days: days });
    closeModal(); toast('Schedule saved.'); go('hr');
  });
}

async function warnModal(empId, category, details, presetLevel) {
  if (!S.warn) S.warn = await api('listWarnings');
  await loadEmps();
  const next = id => (S.warn.next || {})[id] || LEVELS[0];
  openModal(`<h3>Issue warning</h3>
    <form id="wForm">
      <label>${esc(W)}<select name="empId" id="wEmp" required><option value="">Select…</option>${empOptions(empId)}</select></label>
      <div class="fgrid">
        <label>Level<select name="level" id="wLevel">${LEVELS.map(l => `<option ${l === (presetLevel || next(empId)) ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label>Category<select name="category">${WCATS.map(c => `<option ${c === category ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        <label>Date<input name="date" type="date" value="${todayISO()}"></label>
      </div>
      <p class="muted small" id="wHint" style="margin-top:-4px"></p>
      <label>What happened<textarea name="details" required>${esc(details || '')}</textarea></label>
      <div class="hidden" id="wDeact">
        <label>Last working day<input name="lastDay" type="date" value="${todayISO()}"></label>
        <label class="agree"><input type="checkbox" name="deactivate" checked> Turn off their portal access now</label>
        <div class="note small">They'll receive a formal <b>termination letter</b> by email (PDF attached, also saved in their folder). It covers the reason, final pay, and ending access to accounts.</div>
      </div>
      <p class="muted small">They'll get an email and must acknowledge it in their portal.</p>
      <div class="macts"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="btn danger">Issue warning</button></div>
    </form>`);
  const hint = () => {
    const id = $('#wEmp').value, term = $('#wLevel').value === 'Termination';
    $('#wHint').textContent = id ? 'Suggested next step: ' + next(id) + (term && next(id) !== 'Termination' ? ' · Termination can skip steps depending on severity.' : '') : '';
    $('#wDeact').classList.toggle('hidden', !term);
    $('#wForm .btn.danger').textContent = term ? 'Terminate & send letter' : 'Issue warning';
  };
  $('#wEmp').onchange = () => { if (!presetLevel) $('#wLevel').value = next($('#wEmp').value); hint(); };
  $('#wLevel').onchange = hint; hint();
  $('#wForm').onsubmit = e => {
    e.preventDefault(); const f = fd(e.target);
    run(e.target.querySelector('.btn'), async () => {
      if (f.level === 'Termination' && !confirm('Terminate this ' + W.toLowerCase() + ' and email the termination letter now?')) return;
      await api('issueWarning', { empId: f.empId, level: f.level, category: f.category, date: f.date, details: f.details, deactivate: !!f.deactivate, lastDay: f.lastDay });
      closeModal(); toast(f.level === 'Termination' ? 'Termination letter sent.' : 'Warning issued and emailed.'); S.warn = null; S.emps = null;
      if (S.tab === 'hr' || S.tab === 'employees') go(S.tab);
    });
  };
}

    <div class="mrow"><span>Total (100%)</span><b>${money(e.gross)}</b></div>
    <div class="mrow"><span>${esc(AGENCY)} share (${+(100 - e.rates.share * 100).toFixed(0)}%)</span><b>${money(e.agencyShare)}</b></div>
    <div class="mrow"><span>${esc(W)} salary (${+(e.rates.share * 100).toFixed(0)}%)</span><b class="gold-t">${money(e.employeePay)}</b></div>
    <div class="fgrid" style="margin-top:14px">
      <label>Bonus / deduction ($)<input id="psAdj" type="number" step="0.01" value="0" placeholder="use minus for deduction"></label>
      <label>Reason<input id="psNote" maxlength="200" placeholder="optional"></label>
    </div>
    <div class="mrow" style="border:0"><span><b>Net pay on payslip</b></span><b class="gold-t" id="psNet">${money(e.employeePay)}</b></div>
    <label class="agree"><input type="checkbox" id="psSend" checked> Email the payslip PDF to ${esc(e.name)}</label>
    <p class="muted small">The payslip only shows the ${esc(W.toLowerCase())}'s share — the 100% total and ${esc(AGENCY)} share stay on your side.</p>
    <div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button><button class="btn" id="psBtn">Generate payslip</button></div>`);
  $('#psAdj').oninput = ev => { $('#psNet').textContent = money(e.employeePay + (Number(ev.target.value) || 0)); };
  $('#psBtn').onclick = ev => run(ev.currentTarget, async () => {
    const r = await api('generatePayslip', { empId: empId, date: S.pay.weekStart, adjustment: $('#psAdj').value, adjustmentNote: $('#psNote').value, send: $('#psSend').checked });
    closeModal(); toast(r.sent ? 'Payslip generated and emailed.' : 'Payslip generated.'); go('payroll');
  });
}

loadBranding().then(boot);
</script>
</body>
</html>
