<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mafiaz Portal</title>
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0f13; --panel:#151821; --panel2:#1b1f2a; --line:#262b38; --text:#eceef3; --muted:#8d95a6;
  --gold:#d4a24c; --gold2:#f0c46d; --green:#3ecf8e; --red:#ef5b5b; --blue:#5aa9ff; --amber:#f5a524; --violet:#a78bfa;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(13,15,19,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.brand{display:flex;gap:10px;align-items:center}
.brand b{letter-spacing:3px;text-transform:uppercase;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px}
.logo{width:42px;height:42px;border-radius:10px;object-fit:cover;display:block;border:1px solid rgba(212,162,76,.35)}
.auth-card .logo{width:64px;height:64px;border-radius:14px}
.who{display:flex;gap:8px;align-items:center}
.who span{color:var(--muted);margin-right:6px}
.tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:9px 14px;border-radius:10px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--text);background:var(--panel)}
.tabs button.on{color:#111;background:var(--gold)}
.badge:empty{display:none}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
.grid2>.card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.stat.gold{border-color:rgba(212,162,76,.45);background:linear-gradient(160deg,rgba(212,162,76,.14),var(--panel))}
.stat.gold .v{color:var(--gold2)}
.stack{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{margin:0 auto 0 0;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:12px}
/* forms */
label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto;display:inline-block;margin:0 8px 0 0;accent-color:var(--gold)}
input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.fgrid .full{grid-column:1/-1}
.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.big{width:100%;padding:14px;font-size:15px;margin-top:6px}
.btn.danger{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#062b1b}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--text)}
.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.sm{padding:6px 10px;font-size:12px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--panel2);font-weight:600}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:200px}
tr.tot td{font-weight:700;background:var(--panel2)}
.gold-t{color:var(--gold2);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:26px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.on,.st.Approved{color:var(--green);background:rgba(62,207,142,.12)}
.st.out{color:var(--blue);background:rgba(90,169,255,.12)}
.st.off,.st.Pending{color:var(--amber);background:rgba(245,165,36,.12)}
.st.none,.st.Denied,.st.High{color:var(--red);background:rgba(239,91,91,.12)}
.st.Cancelled,.st.Inactive,.st.Low{color:var(--muted);background:rgba(141,149,166,.12)}
.st.Medium{color:var(--amber);background:rgba(245,165,36,.12)}
.st.Open{color:var(--red);background:rgba(239,91,91,.12)}
.st.Monitoring{color:var(--violet);background:rgba(167,139,250,.12)}
.st.Resolved,.st.Active{color:var(--green);background:rgba(62,207,142,.12)}
/* clock */
.clock{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px}
.clock.live{border-color:rgba(62,207,142,.45);background:linear-gradient(160deg,rgba(62,207,142,.1),var(--panel))}
.clock form{text-align:left;margin-top:6px}
.status{font-weight:700}
.status.on{color:var(--green)}
.status.off{color:var(--muted)}
.timer{font-size:46px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
/* requests */
.req{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.req .meta{color:var(--muted);font-size:12px;margin-top:4px}
.req .reason{margin-top:8px}
.req .acts{display:flex;gap:6px;align-items:flex-start}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0%,rgba(212,162,76,.16),transparent 45%),var(--bg)}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.auth-card .brand{margin-bottom:22px}
.auth-card h2{margin:0 0 4px}
.err{background:rgba(239,91,91,.12);color:#ffb3b3;border:1px solid rgba(239,91,91,.35);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.onb{max-width:860px;margin:0 auto;padding:24px 16px 60px}
.steps{display:flex;gap:8px;margin:0 0 16px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.docbox{background:#fbfaf7;color:#1d1d1f;border-radius:12px;padding:30px;max-height:58vh;overflow:auto;line-height:1.6;font-size:13.5px}
.docbox .doc-head{display:flex;justify-content:space-between;border-bottom:3px solid #b8892f;padding-bottom:10px;margin-bottom:16px}
.docbox .doc-brand{font-size:22px;font-weight:800;letter-spacing:4px;text-transform:uppercase}
.docbox .doc-date{color:#777;padding-top:8px}
.docbox h1{font-size:19px;margin:0 0 12px}
.docbox h2{font-size:14px;margin:16px 0 4px;color:#7a5a17}
.docbox .ex{background:#f3ead6;padding:8px 12px;border-left:3px solid #b8892f;border-radius:4px}
.docbox .sign-grid{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.docbox .sign-grid>div{flex:1;min-width:200px}
.docbox .sig{font-family:'Dancing Script',cursive;font-size:28px;color:#1b2a6b;min-height:40px}
.docbox .agency-sig{font-family:Inter;font-size:14px;font-weight:700;color:#111;padding-top:14px}
.docbox .sig-line{border-top:1px solid #333}
.docbox .sig-cap{font-size:11px;color:#666;margin-top:4px}
.sigprev{font-family:'Dancing Script',cursive;font-size:30px;color:var(--gold2);min-height:44px;border-bottom:1px solid var(--line);margin:4px 0 14px;padding:0 4px}
.agree{display:flex;align-items:flex-start;color:var(--text);font-size:13px;margin:14px 0}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-card h3{margin:0 0 14px}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.mrow b{font-variant-numeric:tabular-nums}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t-item{background:#232836;border:1px solid var(--line);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.t-item.ok{border-color:rgba(62,207,142,.5)}
.t-item.err{border-color:rgba(239,91,91,.6);color:#ffc4c4}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:60px;color:var(--muted)}
.chart-box{position:relative;height:300px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--gold);color:#111;font-weight:700}
.rule summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule summary::-webkit-details-marker{display:none}
.rule summary::before{content:"▸";color:var(--gold);transition:transform .15s}
.rule[open] summary::before{transform:rotate(90deg)}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.rule-step{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.rule-step .num{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#111;font-weight:800;font-size:13px}
.rule-ex{margin-top:12px;padding:12px 14px;border-radius:12px;border-left:3px solid var(--gold);background:rgba(212,162,76,.08);line-height:1.7}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .timer{font-size:38px}
  .who span{display:none}
  .top{padding:12px 16px}
}
</style>
</head>

/* ---------------- state & helpers ---------------- */
const S = { token: null, role: null, name: '', data: null, tab: null, charts: {}, emps: null, dashDate: '', payDate: '', reqFilter: 'Pending', days: 30, prefill: null };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hm = h => { const t = Math.round((Number(h) || 0) * 60); return Math.floor(t / 60) + 'h ' + String(t % 60).padStart(2, '0') + 'm'; };
const fd = f => Object.fromEntries(new FormData(f).entries());
const loading = () => { $('#view').innerHTML = '<div class="loading"><span class="spin"></span></div>'; };
const errBox = m => `<div class="card"><div class="err">${esc(m)}</div><button class="ghost" onclick="go(S.tab)">Try again</button></div>`;
const stat = (k, v, s, cls) => `<div class="stat ${cls || ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

async function api(action, payload) {
  if (API_URL.indexOf('http') !== 0) throw new Error('API_URL is not set yet. Paste your Apps Script web app URL at the top of index.html.');
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, token: S.token }, payload || {})) });
  } catch (e) { throw new Error('Could not reach the server. Check your internet connection.'); }
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { logout(true); throw new Error('Your session expired. Please log in again.'); }
    if (j.error === 'ONBOARDING_REQUIRED') { boot(); throw new Error('Please finish your onboarding first.'); }
    throw new Error(j.error);
  }
  return j.data;
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 't-item ' + (type || 'ok');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

async function run(btn, fn) {
  let label;
  if (btn) { btn.disabled = true; label = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'err'); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; } }
}

function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBody').innerHTML = ''; }

function downloadB64(f) {
  const bin = atob(f.b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: f.mime || 'application/pdf' }));
  const a = document.createElement('a');
  a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function clockStr(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
setInterval(() => {
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = clockStr(Date.now() - Number(el.dataset.since)); });
  document.querySelectorAll('[data-live]').forEach(el => { el.textContent = hm(Number(el.dataset.base || 0) + (Date.now() - Number(el.dataset.live)) / 3.6e6); });
}, 1000);

}

/* ---------------- boot & auth ---------------- */
const AGENT_LINK = (() => { try { return new URLSearchParams(location.search).has('agent'); } catch (e) { return false; } })();
let agentLinkHandled = false;

async function boot() {
  S.token = store.get('mz_token'); S.role = store.get('mz_role'); S.name = store.get('mz_name') || '';
  // Agent invite link: never open someone else's (e.g. admin's) saved session
  if (AGENT_LINK && !agentLinkHandled) {
    agentLinkHandled = true;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (S.token && S.role === 'admin') {
      store.del('mz_token'); store.del('mz_role'); store.del('mz_name');
      S.token = null; S.role = null; S.name = '';
      return renderLogin('', true);
    }
  }
  if (!S.token) return renderLogin();
  if (S.role === 'admin') return showAdmin();
  try {
    const me = await api('me');
    S.name = me.Name;
    if (!me.AgreementSigned) return renderAgreement();
    if (me.MustChangePassword) return renderSetPassword();
    showEmp();
  } catch (e) { if (S.token) renderLogin(e.message); }
}

function renderLogin(msg, agentView) {
  $('#app').innerHTML = `
  <div class="auth"><div class="auth-card">
    <div class="brand"><img class="logo" src="${LOGO}" alt="Mafiaz logo"><div><b>${AGENCY}</b><small>Payroll & Employee Portal</small></div></div>
    <h2>${agentView ? 'Agent login' : 'Welcome back'}</h2><p class="muted" style="margin:0 0 18px">Log in with the email and password sent to you.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" id="loginPw" type="password" autocomplete="current-password" required></label>
      <label class="agree" style="margin:-4px 0 6px"><input type="checkbox" onchange="$('#loginPw').type=this.checked?'text':'password'"> Show password</label>
      <button class="btn big">Log in</button>
    </form>
    <p class="muted small" style="margin-top:16px">Forgot your password? Ask your admin to resend your login.</p>
  </div></div>`;
  $('#loginForm').onsubmit = e => {
    e.preventDefault();
    const f = fd(e.target);
    run(e.target.querySelector('button'), async () => {
      const r = await api('login', { email: f.email.trim(), password: f.password.trim() });
      S.token = r.token; S.role = r.role; S.name = r.name;
      store.set('mz_token', r.token); store.set('mz_role', r.role); store.set('mz_name', r.name);
      boot();
    });
  };
}

function logout(silent) {
  if (S.token && !silent) api('logout').catch(() => {});
  store.del('mz_token'); store.del('mz_role'); store.del('mz_name');
  S.token = null; S.role = null; S.data = null; S.emps = null; S.tab = null;
  renderLogin();
}

  <header class="top">

function go(t) {
  S.tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  window.scrollTo(0, 0);
  if (S.role === 'admin') ADMIN[t]();
  else if (S.data) EMP[t](); else empRefresh();
}
function badge(t, n) { const el = document.getElementById('b_' + t); if (el) el.textContent = n > 0 ? n : ''; }

function openChangePw() {
  openModal(`<h3>Change password</h3><form id="cpForm">
    <label>Current password<input name="cur" type="password" required></label>
    <label>New password<input name="p1" type="password" minlength="8" required></label>
    <label>Confirm new password<input name="p2" type="password" minlength="8" required></label>
    <div class="macts"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div></form>`);
  $('#cpForm').onsubmit = e => {
    e.preventDefault();

    run(e.target.querySelector('.btn'), async () => {

      await api(S.role === 'admin' ? 'adminChangePassword' : 'changePassword', { currentPassword: f.cur, newPassword: f.p1 });
      closeModal(); toast('Password changed.');

  };
}

async function doClockOut() { await api('clockOut'); toast('Clocked out. Good work today!'); await empRefresh(); }
function fixTime(id) { S.prefill = { id: id }; go('requests'); }

function reqCard(r, admin) {
  const title = r.type === 'TIME_EDIT'
    ? `Time correction${r.shiftId ? '' : ' (missed shift)'} · ${esc(r.clockIn)} → ${esc(r.clockOut)} <span class="muted">(${hm(r.hours)})</span>`
    : `${esc(r.leaveType || 'Day off')} · ${esc(r.dateLabel)}${r.endDate && r.endDate !== r.date ? ' → ' + esc(r.endLabel) : ''}`;
  let acts = '';
  if (r.status === 'Pending') {
    acts = admin
      ? `<button class="btn green sm" onclick="reviewReq('${r.id}','Approved')">Approve</button><button class="btn danger sm" onclick="reviewReq('${r.id}','Denied')">Deny</button>`
      : `<button class="ghost sm" onclick="run(this,async()=>{await api('cancelRequest',{reqId:'${r.id}'});toast('Request cancelled.');await empRefresh();})">Cancel</button>`;
  }
  return `<div class="req"><div style="flex:1;min-width:240px">
      <div>${admin ? `<b>${esc(r.name)}</b> · ` : ''}${title}</div>
      <div class="meta">Sent ${esc(r.created)}${r.account ? ' · ' + esc(r.account) : ''}${r.reviewed ? ' · Reviewed ' + esc(r.reviewed) : ''}</div>
      <div class="reason">${esc(r.reason)}</div>
      ${r.adminNote ? `<div class="meta">Admin note: ${esc(r.adminNote)}</div>` : ''}
    </div><div class="acts"><span class="st ${esc(r.status)}">${esc(r.status)}</span>${acts}</div></div>`;
}

        ${stat('Agency share (30%)', money(t.weekAgency), 'This week so far', 'gold')}
      </div>
      ${t.pending ? `<div class="card" style="border-color:rgba(245,165,36,.45)"><b>${t.pending} pending request(s)</b> <span class="muted">waiting for your approval.</span> <button class="ghost sm" onclick="S.reqFilter='Pending';go('requests')">Review</button></div>` : ''}
      <div class="card"><h3>Employees · ${esc(d.dateLabel)}</h3>
        <div class="tw"><table><thead><tr><th>Employee</th><th>Status</th><th>Shift</th><th>Account</th><th class="n">Hours</th><th class="n">Sales</th><th class="n">Week hrs</th><th class="n">Week sales</th><th class="n">Week salary</th><th></th></tr></thead><tbody>
        ${d.employees.length ? d.employees.map(e => `<tr>
          <td><b>${esc(e.name)}</b><div class="muted small">${esc(e.position || '')}</div></td>
          <td><span class="st ${STATUS_CLS[e.status] || 'none'}">${esc(e.status)}</span></td>
          <td>${e.clockInAt ? `since ${esc(e.since)} · <span data-since="${e.clockInAt}">${clockStr(Date.now() - e.clockInAt)}</span>` : '<span class="muted">—</span>'}</td>
          <td>${esc(e.account || '—')}</td>
          <td class="n">${hm(e.hours)}</td><td class="n">${money(e.sales)}</td>
          <td class="n">${hm(e.weekHours)}</td><td class="n">${money(e.weekSales)}</td><td class="n gold-t">${money(e.weekPay)}</td>
          <td class="n">${e.clockInAt ? `<button class="ghost sm" onclick="adminClockOut('${e.empId}','${esc(e.name).replace(/'/g, '')}')">Clock out</button>` : ''}</td></tr>`).join('')
          : '<tr><td colspan="10" class="empty">No employees yet. Add one in the Employees tab.</td></tr>'}
        </tbody></table></div>
      </div>
      <div class="card"><h3>Last 14 days</h3><div class="chart-box"><canvas id="dashChart"></canvas></div></div>`;
      $('#dashDate').onchange = e => { S.dashDate = e.target.value; go('dash'); };
      chart('dashChart', {
        data: { labels: d.chart.map(x => x.label), datasets: [
          { type: 'bar', label: 'Sales ($)', data: d.chart.map(x => x.sales), backgroundColor: GOLD, borderRadius: 6, yAxisID: 'y' },
          { type: 'line', label: 'Hours', data: d.chart.map(x => x.hours), borderColor: TEAL, backgroundColor: TEAL, tension: .35, yAxisID: 'y1' }] },
        options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
          scales: { y: { beginAtZero: true, title: { display: true, text: 'Sales' } }, y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Hours' } } } }
      });
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  },

  async payroll() {
    loading();
    try {
      const d = await api('weeklyPayroll', { date: S.payDate || '' });
      S.payDate = d.weekStart; S.pay = d; const t = d.totals;
      $('#view').innerHTML = `
      <div class="toolbar"><h2>Weekly payroll</h2>
        <button class="ghost sm" onclick="shiftWeek(-7)">‹ Prev</button>
        <span class="pill">${esc(d.label)}</span>
        <button class="ghost sm" onclick="shiftWeek(7)">Next ›</button>
        <input type="date" id="payDate" value="${d.weekStart}" style="width:auto;margin:0"></div>
      ${payRuleCard()}
      <div class="stats">
        ${stat('Total hours', hm(t.hours))}
        ${stat('Total sales', money(t.sales))}
        ${stat('Total (100%)', money(t.gross), money(t.hourlyPay) + ' hourly + ' + money(t.commission) + ' commission', 'gold')}
        ${stat('Employees\u2019 salary (70%)', money(t.employeePay))}
        ${stat('Agency share (30%)', money(t.agencyShare), '', 'gold')}
      </div>
      <div class="card"><h3>Breakdown <span class="muted small">Total = hours × rate + sales × commission · Salary = total × employee share</span></h3>
        <div class="tw"><table><thead><tr><th>Employee</th><th class="n">Hours</th><th class="n">Sales</th><th class="n">Hourly</th><th class="n">Commission</th><th class="n">Total (100%)</th><th class="n">Employee salary</th><th class="n">Agency share</th><th>Payslip</th></tr></thead><tbody>
        ${d.employees.length ? d.employees.map(e => `<tr>
          <td><b>${esc(e.name)}</b>${e.status !== 'Active' ? ' <span class="st Inactive">Inactive</span>' : ''}<div class="muted small">$${e.rates.rate}/h · ${+(e.rates.comm * 100).toFixed(2)}% · ${+(e.rates.share * 100).toFixed(0)}/${+(100 - e.rates.share * 100).toFixed(0)}</div></td>
          <td class="n">${hm(e.hours)}</td><td class="n">${money(e.sales)}</td><td class="n">${money(e.hourlyPay)}</td><td class="n">${money(e.commission)}</td>
          <td class="n"><b>${money(e.gross)}</b></td><td class="n gold-t">${money(e.employeePay)}</td><td class="n">${money(e.agencyShare)}</td>
          <td>${e.payslip ? `<span class="st Approved">Sent</span> <span class="muted small">${esc(e.payslip.sentAt)}</span><br><button class="ghost sm" onclick="run(this,()=>api('adminPayslipPdf',{id:'${e.payslip.id}'}).then(downloadB64))">PDF</button> <button class="ghost sm" onclick="payslipModal('${e.empId}')">Redo</button>`
            : `<button class="btn sm" onclick="payslipModal('${e.empId}')">Generate</button>`}</td></tr>`).join('')
          : '<tr><td colspan="9" class="empty">No employees.</td></tr>'}
        ${d.employees.length ? `<tr class="tot"><td>Total</td><td class="n">${hm(t.hours)}</td><td class="n">${money(t.sales)}</td><td class="n">${money(t.hourlyPay)}</td><td class="n">${money(t.commission)}</td><td class="n">${money(t.gross)}</td><td class="n">${money(t.employeePay)}</td><td class="n">${money(t.agencyShare)}</td><td></td></tr>` : ''}
        </tbody></table></div>
      </div>`;
      $('#payDate').onchange = e => { S.payDate = e.target.value; go('payroll'); };
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  },

  async requests() {
    loading();
    try {
      const list = await api('listRequests', { status: S.reqFilter });
      if (S.reqFilter === 'Pending') badge('requests', list.length);
      const f = ['Pending', 'Approved', 'Denied', 'All'];
      $('#view').innerHTML = `
      <div class="toolbar"><h2>Requests</h2><div class="seg">${f.map(x => `<button class="${S.reqFilter === x ? 'on' : ''}" onclick="S.reqFilter='${x}';go('requests')">${x}</button>`).join('')}</div></div>
      <div class="card"><div class="stack">${list.length ? list.map(r => reqCard(r, true)).join('') : '<div class="empty">Nothing here.</div>'}</div></div>`;
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  },

  async employees() {
    loading();
    try {
      const list = await loadEmps(true);
      $('#view').innerHTML = `
      <div class="toolbar"><h2>Employees</h2><button class="btn" onclick="addEmpModal()">+ Add employee</button></div>
      <div class="card"><div class="tw"><table><thead><tr><th>Employee</th><th>Position</th><th>Pay terms</th><th>Offer letter</th><th>Login</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.length ? list.map(e => `<tr>
        <td><b>${esc(e.name)}</b><div class="muted small">${esc(e.email)}</div></td>
        <td>${esc(e.position)}<div class="muted small">Start ${esc(e.startDate)}</div></td>
        <td>$${e.rates.rate}/h + ${+(e.rates.comm * 100).toFixed(2)}%<div class="muted small">${+(e.rates.share * 100).toFixed(0)}% employee / ${+(100 - e.rates.share * 100).toFixed(0)}% agency</div></td>
        <td>${e.agreementSigned ? `<span class="st Approved">Signed</span><div class="muted small">${esc(e.signedAt)}${e.agreementUrl ? ` · <a href="${esc(e.agreementUrl)}" target="_blank" rel="noopener">View</a>` : ''}</div>` : '<span class="st Pending">Waiting</span>'}</td>
        <td>${e.passwordSet ? '<span class="st Active">Active</span>' : '<span class="st Pending">Invite sent</span>'}</td>
        <td><span class="st ${e.status}">${e.status}</span>${e.onDuty ? ' <span class="st on">On duty</span>' : ''}</td>
        <td class="n">
          <button class="ghost sm" onclick="run(this,async()=>{await api('resendInvite',{empId:'${e.empId}'});toast('New login sent to ${esc(e.email)}');go('employees')})">Resend login</button>
          ${e.sheetUrl ? `<a class="ghost sm" style="text-decoration:none;display:inline-block" href="${esc(e.sheetUrl)}" target="_blank" rel="noopener">Sheet</a>` : ''}
          <button class="ghost sm" onclick="run(this,async()=>{await api('setEmployeeStatus',{empId:'${e.empId}',status:'${e.status === 'Active' ? 'Inactive' : 'Active'}'});toast('Updated.');go('employees')})">${e.status === 'Active' ? 'Deactivate' : 'Activate'}</button>
        </td></tr>`).join('') : '<tr><td colspan="7" class="empty">No employees yet. Click "Add employee" to send the first login.</td></tr>'}
      </tbody></table></div></div>`;
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  },

  async kpi() {
    loading();
    try {
      await loadEmps();
      const list = await api('listKpi');
      $('#view').innerHTML = `
      <div class="card"><h3>Record a KPI</h3>
        <form id="kpiForm" class="fgrid">
          <label>Employee<select name="empId" required><option value="">Select…</option>${empOptions()}</select></label>
          <label>Date<input name="date" type="date" value="${todayISO()}" required></label>
          <label>KPI / metric<input name="metric" list="kpiList" required placeholder="e.g. Weekly sales"></label>
          <label>Target<input name="target" type="number" step="any"></label>
          <label>Actual<input name="actual" type="number" step="any"></label>
          <label class="full">Notes<input name="notes" maxlength="500"></label>
          <div class="full"><button class="btn">Save KPI</button></div>
        </form>
        <datalist id="kpiList"><option value="Weekly sales"><option value="Hours worked"><option value="Response time (mins)"><option value="Conversion rate (%)"><option value="Sales per hour"><option value="Attendance (%)"></datalist>
      </div>
      <div class="card"><h3>KPI records</h3><div class="tw"><table><thead><tr><th>Date</th><th>Employee</th><th>KPI</th><th class="n">Target</th><th class="n">Actual</th><th class="n">Achieved</th><th>Notes</th><th></th></tr></thead><tbody>
      ${list.length ? list.map(k => { const p = k.target ? Math.round(k.actual / k.target * 100) : null; return `<tr>
        <td>${esc(k.date)}</td><td>${esc(k.name)}</td><td>${esc(k.metric)}</td><td class="n">${k.target}</td><td class="n">${k.actual}</td>
        <td class="n">${p == null ? '—' : `<span class="st ${p >= 100 ? 'on' : p >= 80 ? 'off' : 'none'}">${p}%</span>`}</td>
        <td class="wrap">${esc(k.notes)}</td>
        <td class="n"><button class="ghost sm" onclick="if(confirm('Delete this KPI record?'))run(this,async()=>{await api('deleteKpi',{id:'${k.id}'});go('kpi')})">Delete</button></td></tr>`; }).join('')
        : '<tr><td colspan="8" class="empty">No KPI records yet.</td></tr>'}
      </tbody></table></div></div>`;
      $('#kpiForm').onsubmit = e => { e.preventDefault(); const f = fd(e.target); run(e.target.querySelector('button'), async () => { await api('addKpi', f); toast('KPI saved.'); go('kpi'); }); };
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  },

  async issues() {
    loading();
    try {
      await loadEmps();
      const list = await api('listIssues');
      const cats = ['Attendance', 'Tardiness', 'Missed clock-in/out', 'Sales report', 'Conduct', 'Customer complaint', 'Policy violation', 'Account security', 'Other'];
      const sts = ['Open', 'Monitoring', 'Resolved'];
      $('#view').innerHTML = `
      <div class="card"><h3>Record an issue</h3>
        <form id="issForm" class="fgrid">
          <label>Employee<select name="empId" required><option value="">Select…</option>${empOptions()}</select></label>
          <label>Date<input name="date" type="date" value="${todayISO()}" required></label>
          <label>Category<select name="category">${cats.map(c => `<option>${c}</option>`).join('')}</select></label>
          <label>Severity<select name="severity"><option>Low</option><option>Medium</option><option>High</option></select></label>
          <label class="full">What happened<textarea name="description" required></textarea></label>
          <label class="full">Action taken<input name="actionTaken" placeholder="e.g. Verbal warning, coaching session"></label>
          <label>Status<select name="status">${sts.map(s => `<option>${s}</option>`).join('')}</select></label>
          <div class="full"><button class="btn">Save issue</button></div>
        </form>
      </div>
      <div class="card"><h3>Issue log <span class="pill">${list.filter(i => i.status !== 'Resolved').length} open</span></h3>
        <div class="tw"><table><thead><tr><th>Date</th><th>Employee</th><th>Category</th><th>Severity</th><th>Details</th><th>Action taken</th><th>Status</th></tr></thead><tbody>
        ${list.length ? list.map(i => `<tr>
          <td>${esc(i.date)}</td><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td><span class="st ${esc(i.severity)}">${esc(i.severity)}</span></td>
          <td class="wrap">${esc(i.description)}</td><td class="wrap">${esc(i.actionTaken || '—')}</td>
          <td><select onchange="updIssue('${i.id}',this)" style="margin:0;padding:6px 8px;width:auto">${sts.map(s => `<option ${s === i.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')
          : '<tr><td colspan="7" class="empty">No issues recorded.</td></tr>'}
        </tbody></table></div>
      </div>`;
      $('#issForm').onsubmit = e => { e.preventDefault(); const f = fd(e.target); run(e.target.querySelector('button'), async () => { await api('addIssue', f); toast('Issue recorded.'); go('issues'); }); };
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  },

  async analytics() {
    loading();
    try {
      const d = await api('analytics', { days: S.days });
      const tot = d.perEmp.reduce((a, x) => { a.h += x.hours; a.s += x.sales; a.g += x.gross; a.a += x.agencyShare; return a; }, { h: 0, s: 0, g: 0, a: 0 });
      $('#view').innerHTML = `
      <div class="toolbar"><h2>Analytics</h2><span class="pill">${esc(d.rangeLabel)}</span>
        <div class="seg">${[7, 30, 90].map(n => `<button class="${S.days === n ? 'on' : ''}" onclick="S.days=${n};go('analytics')">${n} days</button>`).join('')}</div></div>
      <div class="stats">
        ${stat('Hours', hm(tot.h))}${stat('Sales', money(tot.s))}
        ${stat('Sales per hour', money(tot.h ? tot.s / tot.h : 0))}
        ${stat('Total (100%)', money(tot.g), '', 'gold')}${stat('Agency share', money(tot.a), '', 'gold')}
      </div>
      <div class="grid2">
        <div class="card"><h3>Daily sales</h3><div class="chart-box"><canvas id="cSales"></canvas></div></div>
        <div class="card"><h3>Daily hours</h3><div class="chart-box"><canvas id="cHours"></canvas></div></div>
      </div>
      <div class="card"><h3>Sales by employee</h3><div class="chart-box" style="height:${Math.max(220, d.perEmp.length * 38)}px"><canvas id="cEmp"></canvas></div></div>
      <div class="card"><h3>Employee performance</h3><div class="tw"><table><thead><tr><th>Employee</th><th class="n">Days worked</th><th class="n">Hours</th><th class="n">Sales #</th><th class="n">Sales</th><th class="n">Sales / hour</th><th class="n">Total (100%)</th><th class="n">Employee salary</th><th class="n">Agency share</th></tr></thead><tbody>
      ${d.perEmp.length ? d.perEmp.map(x => `<tr><td>${esc(x.name)}</td><td class="n">${x.daysWorked}</td><td class="n">${hm(x.hours)}</td><td class="n">${x.count}</td><td class="n">${money(x.sales)}</td><td class="n">${money(x.salesPerHour)}</td><td class="n">${money(x.gross)}</td><td class="n gold-t">${money(x.employeePay)}</td><td class="n">${money(x.agencyShare)}</td></tr>`).join('')
        : '<tr><td colspan="9" class="empty">No data yet.</td></tr>'}
      </tbody></table></div></div>`;
      const opts = { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } };
      chart('cSales', { type: 'bar', data: { labels: d.series.map(x => x.label), datasets: [{ data: d.series.map(x => x.sales), backgroundColor: GOLD, borderRadius: 5 }] }, options: opts });
      chart('cHours', { type: 'line', data: { labels: d.series.map(x => x.label), datasets: [{ data: d.series.map(x => x.hours), borderColor: TEAL, backgroundColor: 'rgba(79,179,169,.15)', fill: true, tension: .35 }] }, options: opts });
      chart('cEmp', { type: 'bar', data: { labels: d.perEmp.map(x => x.name), datasets: [{ data: d.perEmp.map(x => x.sales), backgroundColor: GOLD, borderRadius: 5 }] }, options: { maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } } });
    } catch (e) { $('#view').innerHTML = errBox(e.message); }
  }
};

/* ---------------- admin actions ---------------- */
function shiftWeek(n) {
  const p = (S.payDate || todayISO()).split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  S.payDate = d.toISOString().slice(0, 10);
  go('payroll');
}

function adminClockOut(id, name) {
  if (!confirm('Clock out ' + name + ' now?')) return;
  run(null, async () => { await api('adminClockOut', { empId: id }); toast(name + ' clocked out.'); go('dash'); });
}

function reviewReq(id, decision) {
  openModal(`<h3>${decision === 'Approved' ? 'Approve' : 'Deny'} request</h3>
    <label>Note to employee (optional)<textarea id="rvNote" placeholder="${decision === 'Denied' ? 'Let them know why' : 'Optional'}"></textarea></label>
    <div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button>
    <button class="btn ${decision === 'Approved' ? 'green' : 'danger'}" id="rvBtn">${decision === 'Approved' ? 'Approve' : 'Deny'}</button></div>`);
  $('#rvBtn').onclick = e => run(e.currentTarget, async () => {
    await api('reviewRequest', { reqId: id, decision: decision, note: $('#rvNote').value });
    closeModal(); toast('Request ' + decision.toLowerCase() + '. Employee notified.'); go('requests');
  });
}

function updIssue(id, sel) { run(null, async () => { await api('updateIssue', { id: id, status: sel.value }); toast('Issue updated.'); }); }

function addEmpModal() {
  openModal(`<h3>Add employee</h3>
    <p class="muted small" style="margin-top:-6px">They'll get an email with their login. On first login they sign the offer letter, then set their own password.</p>
    <form id="aeForm" class="fgrid">
      <label class="full">Full name<input name="name" required maxlength="100"></label>
      <label class="full">Email<input name="email" type="email" required></label>
      <label>Position<input name="position" value="Agent"></label>
      <label>Start date<input name="startDate" type="date" value="${todayISO()}"></label>
      <label>Hourly rate ($)<input name="hourlyRate" type="number" step="0.01" min="0" value="3"></label>
      <label>Commission (%)<input name="commissionPct" type="number" step="0.01" min="0" value="1"></label>
      <label>Employee share (%)<input name="sharePct" type="number" step="1" min="1" max="100" value="70"></label>
      <div class="full macts"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="btn">Add &amp; send login</button></div>
    </form>`);
  $('#aeForm').onsubmit = e => {
    e.preventDefault();
    const f = fd(e.target);
    run(e.target.querySelector('.btn'), async () => {
      await api('addEmployee', f);
      closeModal(); toast('Employee added. Login sent to ' + f.email); go('employees');
    });
  };
}

function payslipModal(empId) {
  const e = S.pay.employees.find(x => x.empId === empId);
  openModal(`<h3>Payslip · ${esc(e.name)}</h3>
    <div class="muted small" style="margin-bottom:10px">${esc(S.pay.label)}</div>
    <div class="mrow"><span>Hours</span><b>${hm(e.hours)}</b></div>
    <div class="mrow"><span>Sales</span><b>${money(e.sales)}</b></div>
    <div class="mrow"><span>Total (100%)</span><b>${money(e.gross)}</b></div>
    <div class="mrow"><span>Agency share (${+(100 - e.rates.share * 100).toFixed(0)}%)</span><b>${money(e.agencyShare)}</b></div>
    <div class="mrow"><span>Employee salary (${+(e.rates.share * 100).toFixed(0)}%)</span><b class="gold-t">${money(e.employeePay)}</b></div>
    <div class="fgrid" style="margin-top:14px">
      <label>Bonus / deduction ($)<input id="psAdj" type="number" step="0.01" value="0" placeholder="use minus for deduction"></label>
      <label>Reason<input id="psNote" maxlength="200" placeholder="optional"></label>
    </div>
    <div class="mrow" style="border:0"><span><b>Net pay on payslip</b></span><b class="gold-t" id="psNet">${money(e.employeePay)}</b></div>
    <label class="agree"><input type="checkbox" id="psSend" checked> Email the payslip PDF to ${esc(e.name)}</label>
    <p class="muted small">The payslip only shows the employee's share — the 100% total and agency share stay on your side.</p>
    <div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button><button class="btn" id="psBtn">Generate payslip</button></div>`);
  $('#psAdj').oninput = ev => { $('#psNet').textContent = money(e.employeePay + (Number(ev.target.value) || 0)); };
  $('#psBtn').onclick = ev => run(ev.currentTarget, async () => {
    const r = await api('generatePayslip', { empId: empId, date: S.pay.weekStart, adjustment: $('#psAdj').value, adjustmentNote: $('#psNote').value, send: $('#psSend').checked });
    closeModal(); toast(r.sent ? 'Payslip generated and emailed.' : 'Payslip generated.'); go('payroll');
  });
}

try { document.getElementById('favicon').href = LOGO; } catch (e) {}
boot();
